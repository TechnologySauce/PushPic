<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PushPic - 打开即用的 GitHub Pages 图床，图片直接上传到部署仓库" />
  <title>PushPic · 开箱即用图床</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">P</span>
      <div>
        <h1>PushPic</h1>
        <p>Simple image hosting powered by GitHub Pages</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="repoBadge" class="badge badge-ok">TechnologySauce/PushPic</span>
    </div>
  </header>

  <main class="container">
    <section class="card upload-card">
      <div class="card-head">
        <h2>上传图片</h2>
        <span class="hint">支持拖拽 · 最多 20 张 · 单张 ≤ 50 MB</span>
      </div>
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖拽图片上传">
        <div class="dropzone-icon">＋</div>
        <p class="dropzone-title">拖拽图片到这里，或点击选择文件</p>
        <p class="dropzone-sub">图片会直接上传到本仓库的 <code>images/</code> 目录，无需配置</p>
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
      </div>
      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress-bar"><div id="progressBar" class="progress-fill"></div></div>
        <span id="progressText" class="progress-text"></span>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>图片库</h2>
        <div class="gallery-actions">
          <input id="searchInput" class="input search" type="search" placeholder="搜索文件名…" aria-label="搜索文件名" />
          <button id="refreshBtn" class="btn btn-ghost" type="button">刷新</button>
        </div>
      </div>
      <div id="gallery" class="gallery">
        <p class="empty">正在加载图片库…</p>
      </div>
      <div class="pagination" hidden id="pagination">
        <button id="prevBtn" class="btn btn-ghost" type="button">上一页</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="btn btn-ghost" type="button">下一页</button>
      </div>
    </section>
  </main>

  <div id="previewModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-preview="1"></div>
    <div class="modal-panel preview-panel" role="dialog" aria-modal="true" aria-label="图片预览">
      <div class="modal-head">
        <h2 id="previewName"></h2>
        <button class="icon-btn" type="button" data-close-preview="1" aria-label="关闭">×</button>
      </div>
      <div class="preview-body"><img id="previewImg" alt="预览" /></div>
      <div class="preview-links" id="previewLinks"></div>
    </div>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
